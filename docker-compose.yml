# SathiX-OS — full stack, one container per service
# Usage: cp .env.example .env && docker compose up --build

name: sathix-os

networks:
  sathix:
    driver: bridge

services:
  # ── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    networks: [sathix]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sathix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sathix_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sathix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sathix} -d ${POSTGRES_DB:-sathix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [sathix]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    networks: [sathix]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Core API ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    networks: [sathix]
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file: [.env]
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sathix}:${POSTGRES_PASSWORD:-sathix_dev_password}@postgres:5432/${POSTGRES_DB:-sathix}
      REDIS_URL: redis://redis:6379
      RAG_ENGINE_URL: http://rag-service:3001
      LANGUAGE_ENGINE_URL: http://language-engine:4001
      VOICE_SERVICE_URL: http://voice-service:4002
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4003
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100,http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rag-service: { condition: service_healthy }
      language-engine: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  rag-service:
    build:
      context: ./rag-service
    networks: [sathix]
    ports:
      - "${RAG_PORT:-3001}:3001"
    env_file: [.env]
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sathix}:${POSTGRES_PASSWORD:-sathix_dev_password}@postgres:5432/${POSTGRES_DB:-sathix}
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE: qdrant
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      ANSWER_GENERATOR: ${ANSWER_GENERATOR:-noop}
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/rag/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  scraper-worker:
    build:
      context: ./scraper-engine
    networks: [sathix]
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sathix}:${POSTGRES_PASSWORD:-sathix_dev_password}@postgres:5432/${POSTGRES_DB:-sathix}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${SCRAPER_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Language Engine (Node + Python ML) ──────────────────────
  language-engine-ml:
    build:
      context: ./language-engine/python
    networks: [sathix]
    ports:
      - "${LANGUAGE_ML_PORT:-8001}:8001"
    environment:
      PYTHON_ML_SERVICE_PORT: 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  language-engine:
    build:
      context: ./language-engine
    networks: [sathix]
    ports:
      - "${LANGUAGE_PORT:-4001}:4001"
    env_file: [.env]
    environment:
      PORT: 4001
      NODE_ENV: production
      PYTHON_ML_SERVICE_URL: http://language-engine-ml:8001
      BACKEND_URL: http://backend:5000
    depends_on:
      language-engine-ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Voice (Node + STT + TTS inference) ──────────────────────
  stt-inference:
    build:
      context: ./voice-service
      dockerfile: python/stt/Dockerfile
    networks: [sathix]
    ports:
      - "${STT_PORT:-8002}:8002"
    environment:
      STT_MODEL_PATH: ${STT_MODEL_PATH:-/models/faster-whisper-small}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
    volumes:
      - ${VOICE_MODEL_DIR:-./runtime-models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  tts-inference:
    build:
      context: ./voice-service
      dockerfile: python/tts/Dockerfile
    networks: [sathix]
    ports:
      - "${TTS_PORT:-8003}:8003"
    environment:
      TTS_MODEL_PATH: ${TTS_MODEL_PATH:-/models/piper-en-us-lessac.onnx}
    volumes:
      - ${VOICE_MODEL_DIR:-./runtime-models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8003/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  voice-service:
    build:
      context: ./voice-service
    networks: [sathix]
    ports:
      - "${VOICE_PORT:-4002}:4002"
    env_file: [.env]
    environment:
      PORT: 4002
      NODE_ENV: production
      STT_PROVIDER: python-http
      TTS_PROVIDER: python-http
      LANGUAGE_ENGINE_URL: http://language-engine:4001
      BACKEND_URL: http://backend:5000
      STT_INFERENCE_URL: http://stt-inference:8002
      TTS_INFERENCE_URL: http://tts-inference:8003
    depends_on:
      stt-inference: { condition: service_started }
      tts-inference: { condition: service_started }
      language-engine: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── WhatsApp transport ──────────────────────────────────────
  whatsapp-service:
    build:
      context: ./whatsapp-service
    networks: [sathix]
    ports:
      - "${WHATSAPP_PORT:-4003}:4003"
    env_file: [.env]
    environment:
      PORT: 4003
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
      WHATSAPP_DEV_MODE: ${WHATSAPP_DEV_MODE:-true}
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontends ───────────────────────────────────────────────
  admin-panel:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
    networks: [sathix]
    ports:
      - "${ADMIN_PANEL_PORT:-3100}:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
    depends_on:
      backend: { condition: service_healthy }

  user-panel:
    build:
      context: ./user-panel
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    networks: [sathix]
    ports:
      - "${USER_PANEL_PORT:-3000}:80"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data:
  qdrant_data:
