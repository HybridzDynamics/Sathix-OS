<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SathiX OS — Digital Citizen Assistant</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyan: { 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4' }
          }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { background-color: #02050A; color: #f8fafc; font-family: system-ui, sans-serif; overflow-x: hidden; }
    
    .mask-image-fade {
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 90%, transparent);
    }
  </style>

  <!-- React 18 & Babel for instant browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Framer Motion UMD -->
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!-- Vite entry point (ignored if opening file directly without server) -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Fallback standalone execution logic -->
  <script type="text/babel">
    const rootEl = document.getElementById('root');
    // Verify root is empty (meaning Vite didn't run) before mounting fallback
    if (rootEl && !rootEl.hasChildNodes()) {
      
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence } = window.Motion;

      // Inline SVG Icons (Replacing Lucide to ensure zero import failures)
      const IconMic = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>;
      const IconSend = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
      const IconPaperclip = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>;
      const IconLanguages = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>;
      const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
      const IconBot = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>;
      const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
      const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
      const IconArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
      const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
      const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
      const IconAward = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
      const IconSparkles = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
      const IconFingerprint = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M11.5 3a8 8 0 0 0-4 3"/><path d="M14 4.5A7 7 0 0 1 20 10.5"/><path d="M12.5 7a5 5 0 0 0-3 3.5"/><path d="M15.5 9A4.5 4.5 0 0 1 17 12"/><path d="M12 12a3 3 0 0 0-3 3.5"/><path d="M15 15a4 4 0 0 1-1.5 3"/><path d="M12 19.5v2.5"/><path d="M9.5 12.5a4 4 0 0 1 5 0"/></svg>;

      // --- Inline Components ---
      
      const AIOrb = ({ state }) => {
        const orbVariants = {
          idle: { scale: [1, 1.05, 1], rotate: 0, borderRadius: ["50%", "45%", "50%"], boxShadow: "0px 0px 40px rgba(6, 182, 212, 0.4)", transition: { duration: 4, repeat: Infinity, ease: "easeInOut" } },
          listening: { scale: [1, 1.2, 1.1, 1.25, 1], rotate: 0, borderRadius: ["50%", "40%", "50%", "35%", "50%"], boxShadow: "0px 0px 80px rgba(168, 85, 247, 0.7)", transition: { duration: 1.5, repeat: Infinity, ease: "easeInOut" } },
          thinking: { scale: 0.9, rotate: 360, borderRadius: ["50%", "30%", "50%"], boxShadow: "0px 0px 60px rgba(59, 130, 246, 0.6)", transition: { duration: 2, repeat: Infinity, ease: "linear" } },
          interview: { scale: 0.8, y: -150, boxShadow: "0px 0px 30px rgba(6, 182, 212, 0.3)", transition: { duration: 1, type: "spring", bounce: 0.4 } },
          roadmap: { scale: 0.6, y: -300, opacity: 0.5, boxShadow: "0px 0px 20px rgba(16, 185, 129, 0.3)", transition: { duration: 1.2, type: "spring", bounce: 0.3 } }
        };
        const coreGlowVariants = {
          idle: { background: "radial-gradient(circle, #22d3ee 0%, #0369a1 100%)" },
          listening: { background: "radial-gradient(circle, #e879f9 0%, #7e22ce 100%)" },
          thinking: { background: "radial-gradient(circle, #60a5fa 0%, #1e3a8a 100%)" },
          interview: { background: "radial-gradient(circle, #22d3ee 0%, #0369a1 100%)" },
          roadmap: { background: "radial-gradient(circle, #34d399 0%, #065f46 100%)" },
        };
        return (
          <motion.div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-10" initial="idle" animate={state} variants={orbVariants}>
            <motion.div className="absolute w-48 h-48 rounded-full border border-white/10" animate={{ rotate: state === 'thinking' ? -360 : 180, scale: state === 'listening' ? [1, 1.3, 1] : 1 }} transition={{ duration: 4, repeat: Infinity, ease: "linear" }} />
            <motion.div className="absolute w-32 h-32 rounded-full border-2 border-dashed border-cyan-500/30" animate={{ rotate: state === 'thinking' ? 360 : -90, opacity: state === 'idle' ? 0.3 : 0.8 }} transition={{ duration: 8, repeat: Infinity, ease: "linear" }} />
            <motion.div className="w-24 h-24 rounded-full flex items-center justify-center overflow-hidden relative backdrop-blur-xl" variants={coreGlowVariants}>
              <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-tr from-transparent via-white/40 to-transparent mix-blend-overlay"></div>
              <div className="absolute -top-4 -left-4 w-12 h-12 bg-white/60 blur-xl rounded-full"></div>
            </motion.div>
          </motion.div>
        );
      };

      const VoiceDock = ({ onSendMessage, onVoiceToggle, isListening }) => {
        const [inputValue, setInputValue] = useState('');
        const [isExpanded, setIsExpanded] = useState(false);
        const handleSubmit = (e) => { e.preventDefault(); if (inputValue.trim()) { onSendMessage(inputValue); setInputValue(''); setIsExpanded(false); } };
        return (
          <motion.div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex items-end justify-center" initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ type: "spring", damping: 20, stiffness: 100 }}>
            <motion.div className="bg-black/40 backdrop-blur-3xl border border-white/10 rounded-full p-2 flex items-center gap-2 shadow-[0_0_40px_rgba(0,0,0,0.5)] overflow-hidden" animate={{ width: isExpanded ? 400 : 'auto', borderRadius: isExpanded ? '24px' : '9999px' }} transition={{ type: "spring", bounce: 0.2 }}>
              <AnimatePresence>
                {!isExpanded && (
                  <motion.button initial={{ width: 0, opacity: 0 }} animate={{ width: 'auto', opacity: 1 }} exit={{ width: 0, opacity: 0 }} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/70 transition-colors shrink-0">
                    <IconLanguages />
                  </motion.button>
                )}
              </AnimatePresence>
              <AnimatePresence>
                {!isExpanded && (
                  <motion.div initial={{ width: 0, opacity: 0 }} animate={{ width: 120, opacity: 1 }} exit={{ width: 0, opacity: 0 }} className="px-4 text-white/50 text-sm cursor-text shrink-0" onClick={() => setIsExpanded(true)}>
                    Type a message...
                  </motion.div>
                )}
              </AnimatePresence>
              <AnimatePresence>
                {isExpanded && (
                  <motion.form initial={{ opacity: 0, flex: 0 }} animate={{ opacity: 1, flex: 1 }} exit={{ opacity: 0, flex: 0 }} onSubmit={handleSubmit} className="flex items-center gap-2 px-2 overflow-hidden w-full">
                    <button type="button" className="text-white/50 hover:text-white/90"><IconPaperclip /></button>
                    <input autoFocus type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="Ask SathiX..." className="bg-transparent border-none outline-none text-white text-sm w-full placeholder-white/40" />
                    <button type="submit" disabled={!inputValue.trim()} className="w-8 h-8 rounded-full bg-cyan-500 flex items-center justify-center text-black disabled:opacity-50 disabled:bg-white/20 shrink-0"><IconSend /></button>
                    <button type="button" onClick={() => setIsExpanded(false)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white/70 shrink-0 ml-1"><IconX /></button>
                  </motion.form>
                )}
              </AnimatePresence>
              <motion.button onClick={() => { setIsExpanded(false); onVoiceToggle(); }} className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 transition-colors ${isListening ? 'bg-purple-500 text-white shadow-[0_0_20px_rgba(168,85,247,0.5)]' : 'bg-white/10 hover:bg-white/20 text-white'}`} whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }}>
                <IconMic />
              </motion.button>
            </motion.div>
          </motion.div>
        );
      };

      const ConversationCanvas = ({ messages }) => {
        const scrollRef = useRef(null);
        useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);
        return (
          <motion.div className="fixed inset-0 z-20 flex flex-col justify-end pointer-events-none pb-32 pt-24" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
            <div ref={scrollRef} className="max-w-3xl w-full mx-auto px-4 overflow-y-auto no-scrollbar flex flex-col gap-6 pointer-events-auto mask-image-fade">
              <AnimatePresence initial={false}>
                {messages.map((msg) => (
                  <motion.div key={msg.id} initial={{ opacity: 0, y: 20, scale: 0.95, filter: 'blur(10px)' }} animate={{ opacity: 1, y: 0, scale: 1, filter: 'blur(0px)' }} transition={{ type: "spring", bounce: 0.3, duration: 0.6, delay: msg.sender === 'ai' ? 0.2 : 0 }} className={`flex w-full ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`flex gap-3 max-w-[85%] ${msg.sender === 'user' ? 'flex-row-reverse' : ''}`}>
                      <div className="shrink-0 mt-1">
                        {msg.sender === 'ai' ? (
                          <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]"><IconBot /></div>
                        ) : (
                          <div className="w-8 h-8 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center"><IconUser /></div>
                        )}
                      </div>
                      <div className={`px-5 py-4 rounded-3xl text-[15px] leading-relaxed shadow-xl backdrop-blur-2xl ${msg.sender === 'user' ? 'bg-white/10 text-white border border-white/10 rounded-tr-sm' : 'bg-black/40 text-white/90 border border-cyan-500/20 rounded-tl-sm shadow-[0_4px_30px_rgba(0,0,0,0.5)]'}`}>
                        {msg.text.split('**').map((part, i) => (i % 2 === 1 ? <strong key={i} className={msg.sender === 'ai' ? 'text-cyan-300 font-semibold' : 'font-semibold'}>{part}</strong> : part))}
                      </div>
                    </div>
                  </motion.div>
                ))}
              </AnimatePresence>
              <div className="h-4 w-full shrink-0"></div>
            </div>
          </motion.div>
        );
      };

      const AnimatedRoadmap = ({ steps }) => {
        const getIconForStep = (title) => {
          if (title.toLowerCase().includes('document') || title.toLowerCase().includes('upload')) return <IconUpload />;
          if (title.toLowerCase().includes('verification') || title.toLowerCase().includes('inspection')) return <IconMapPin />;
          if (title.toLowerCase().includes('disbursal') || title.toLowerCase().includes('benefit')) return <IconAward />;
          return <IconCheck />;
        };
        const containerVariants = { hidden: { opacity: 0 }, visible: { opacity: 1, transition: { staggerChildren: 0.3, delayChildren: 0.2 } } };
        const itemVariants = { hidden: { opacity: 0, x: -20, filter: 'blur(5px)' }, visible: { opacity: 1, x: 0, filter: 'blur(0px)', transition: { type: "spring", bounce: 0.4 } } };
        return (
          <motion.div className="w-full max-w-2xl mx-auto mt-8 relative z-20 pointer-events-auto" variants={containerVariants} initial="hidden" animate="visible">
            <div className="bg-black/30 backdrop-blur-2xl border border-white/10 rounded-3xl p-6 shadow-2xl">
              <h3 className="text-white/90 font-semibold mb-6 text-lg tracking-tight">Your Personalized Journey</h3>
              <div className="relative pl-4 border-l border-white/10 space-y-8">
                {steps.map((step) => (
                  <motion.div key={step.id} variants={itemVariants} className="relative pl-6">
                    <div className={`absolute -left-[25px] top-1 w-6 h-6 rounded-full border-2 flex items-center justify-center shadow-lg ${step.status === 'completed' ? 'bg-cyan-500 border-cyan-400 text-black' : step.status === 'active' ? 'bg-black border-cyan-400 text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.5)]' : 'bg-black border-white/20 text-white/30'}`}>
                      {step.status === 'completed' ? <IconCheck /> : getIconForStep(step.title)}
                    </div>
                    <div>
                      <h4 className={`text-base font-semibold ${step.status === 'pending' ? 'text-white/50' : 'text-white'}`}>{step.title}</h4>
                      <p className={`text-sm mt-1 leading-relaxed ${step.status === 'pending' ? 'text-white/30' : 'text-white/70'}`}>{step.description}</p>
                      {step.status === 'active' && step.actionLabel && (
                        <motion.button initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.5 }} className="mt-4 px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-sm flex items-center gap-2 transition-colors shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                          <span>{step.actionLabel}</span><IconArrowRight />
                        </motion.button>
                      )}
                    </div>
                  </motion.div>
                ))}
              </div>
            </div>
          </motion.div>
        );
      };

      const SmartChips = ({ options, onSelect }) => (
        <motion.div className="flex flex-wrap gap-2 mt-4 pointer-events-auto relative z-20" initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.5, staggerChildren: 0.1 }}>
          {options.map((opt, idx) => (
            <motion.button key={idx} onClick={() => onSelect(opt)} initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} whileHover={{ scale: 1.05, backgroundColor: 'rgba(6, 182, 212, 0.15)' }} whileTap={{ scale: 0.95 }} className="px-4 py-2 rounded-full bg-white/5 border border-white/10 text-white/80 text-sm flex items-center gap-2 backdrop-blur-md transition-colors hover:text-cyan-300 hover:border-cyan-500/30 shadow-lg">
              <IconSparkles /><span>{opt}</span>
            </motion.button>
          ))}
        </motion.div>
      );

      const App = () => {
        const [journeyState, setJourneyState] = useState('idle');
        const [messages, setMessages] = useState([]);
        const [roadmapSteps, setRoadmapSteps] = useState([]);
        const [showOptions, setShowOptions] = useState(false);

        useEffect(() => {
          setTimeout(() => {
            setMessages([{ id: 'msg-greeting', sender: 'ai', text: 'Namaste! 🙏 I am SathiX, your digital government companion. Tell me a bit about yourself, or what you need help with.', timestamp: new Date().toISOString() }]);
            setShowOptions(true);
          }, 1000);
        }, []);

        const handleSendMessage = (text) => {
          setMessages(prev => [...prev, { id: `u-${Date.now()}`, sender: 'user', text, timestamp: new Date().toISOString() }]);
          setShowOptions(false);
          setJourneyState('thinking');

          setTimeout(() => {
            if (text.toLowerCase().includes('farmer')) {
              setJourneyState('interview');
              setMessages(prev => [...prev, { id: `a-${Date.now()}`, sender: 'ai', text: 'I understand you are a farmer. To check your eligibility for PM-KISAN (₹6,000/year) and MUDRA loans, I need to verify your landholding and income.', timestamp: new Date().toISOString() }]);
              setTimeout(() => {
                setJourneyState('roadmap');
                setRoadmapSteps([
                  { id: 'rs-1', title: 'Language & Profile Detected', description: 'Farmer, Hindi/English preference.', status: 'completed' },
                  { id: 'rs-2', title: 'Aadhaar e-KYC Validation', description: 'Please authenticate using your fingerprint or OTP.', status: 'active', actionLabel: 'Scan Biometrics' },
                  { id: 'rs-3', title: 'Land Record Verification (Khatauni)', description: 'AI will cross-check with state revenue database.', status: 'pending' },
                  { id: 'rs-4', title: 'Benefit Disbursal Setup', description: 'Direct transfer to Aadhaar-seeded account.', status: 'pending' }
                ]);
              }, 3000);
            } else {
              setJourneyState('idle');
              setMessages(prev => [...prev, { id: `a-${Date.now()}`, sender: 'ai', text: 'I can help with that. Could you provide a bit more detail? Are you looking for health insurance, housing, or educational scholarships?', timestamp: new Date().toISOString() }]);
              setShowOptions(true);
            }
          }, 2000);
        };

        const handleVoiceToggle = () => {
          if (journeyState === 'listening') {
            setJourneyState('idle');
          } else {
            setJourneyState('listening');
            setTimeout(() => { handleSendMessage("I am a farmer looking for schemes."); }, 3000);
          }
        };

        return (
          <div className="relative min-h-screen bg-[#02050A] text-white overflow-hidden font-sans selection:bg-cyan-500/30">
            <div className="absolute inset-0 z-0 overflow-hidden pointer-events-none">
              <motion.div className="absolute top-1/4 left-1/4 w-[800px] h-[800px] bg-cyan-900/10 rounded-full blur-[150px]" animate={{ scale: journeyState === 'thinking' ? [1, 1.2, 1] : 1, opacity: journeyState === 'listening' ? 0.5 : 0.3 }} transition={{ duration: 4, repeat: Infinity, ease: "easeInOut" }} />
              <motion.div className="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-blue-900/10 rounded-full blur-[150px]" animate={{ scale: journeyState === 'thinking' ? [1, 1.5, 1] : 1, opacity: journeyState === 'listening' ? 0.3 : 0.2 }} transition={{ duration: 6, repeat: Infinity, ease: "easeInOut", delay: 1 }} />
              <div className="absolute inset-0 bg-[url('https://transparenttextures.com/patterns/cubes.png')] opacity-[0.02] mix-blend-overlay"></div>
            </div>

            <header className="absolute top-0 w-full px-6 py-4 flex justify-between items-center z-50 text-white/40 text-xs font-medium uppercase tracking-widest pointer-events-none">
              <div className="flex items-center gap-2"><IconFingerprint /><span>SathiX OS // Neural Core</span></div>
              <div className="flex items-center gap-4"><span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>System Online</span><span>10:00 AM IST</span></div>
            </header>

            <AIOrb state={journeyState} />
            <ConversationCanvas messages={messages} />

            <AnimatePresence>
              {showOptions && journeyState === 'idle' && (
                <motion.div className="fixed bottom-32 left-1/2 -translate-x-1/2 z-30" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 10 }}>
                  <SmartChips options={["I am a farmer", "Senior citizen pension", "Student scholarships", "Women entrepreneur loans"]} onSelect={handleSendMessage} />
                </motion.div>
              )}
            </AnimatePresence>

            <AnimatePresence>
              {journeyState === 'roadmap' && (
                <motion.div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm pt-20 pb-32 overflow-y-auto" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                  <AnimatedRoadmap steps={roadmapSteps} />
                </motion.div>
              )}
            </AnimatePresence>

            <VoiceDock onSendMessage={handleSendMessage} onVoiceToggle={handleVoiceToggle} isListening={journeyState === 'listening'} />
          </div>
        );
      };

      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    }
  </script>
</body>

</html>
